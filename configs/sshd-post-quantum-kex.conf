# ==============================================================================
# File: configs/sshd-post-quantum-kex.conf
# Author: Zachary V. Martin, CC
# Description: Hybrid Post-Quantum OpenSSH Server & Client Lockdown Policies
#
# Sanitization Note: Public host IPv4 addresses, VPN overlay endpoints, and
# local system identifiers have been replaced with RFC 5737 TEST-NET
# documentation ranges and generic placeholders to preserve operational
# security (OPSEC).
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Debian 12 Cloud VM Server Policy
# Path: /etc/ssh/sshd_config.d/99-post-quantum-kex.conf (OpenSSH 9.2p1)
# Enforce hybrid lattice-based Streamlined NTRU Prime + X25519 key exchange
# ------------------------------------------------------------------------------
KexAlgorithms sntrup761x25519-sha512@openssh.com
Ciphers chacha20-poly1305@openssh.com
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com
HostKeyAlgorithms ssh-ed25519
PubkeyAuthentication yes
PasswordAuthentication no
PermitRootLogin no
X11Forwarding no
AllowAgentForwarding no

# ------------------------------------------------------------------------------
# 2. Windows 11 Administrative Host Server Policy
# Path: C:\ProgramData\ssh\sshd_config (OpenSSH_for_Windows_10.4p1+)
# Enforce NIST ML-KEM-768 + X25519 hybrid post-quantum key exchange
# ------------------------------------------------------------------------------
# KexAlgorithms mlkem768x25519-sha256
# Ciphers chacha20-poly1305@openssh.com
# MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com
# PubkeyAuthentication yes
# PasswordAuthentication no

# ------------------------------------------------------------------------------
# 3. Hardened Outbound Client Configuration
# Path: ~/.ssh/config
# Pin algorithms on the client side to prevent downgrade attacks
# ------------------------------------------------------------------------------
# Host gcp-bastion-01
#     HostName 192.0.2.10
#     User secadmin
#     Port 8022
#     IdentityFile ~/.ssh/id_ed25519_gcp
#     IdentitiesOnly yes
#     KexAlgorithms sntrup761x25519-sha512@openssh.com
#     Ciphers chacha20-poly1305@openssh.com
#     HostKeyAlgorithms ssh-ed25519
#     ForwardAgent no
#     ServerAliveInterval 60
#     ServerAliveCountMax 3
